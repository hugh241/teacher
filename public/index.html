<script>
    //正式统计
    var _paq = (window._paq = window._paq || []);
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    (function () {
        var u = "https://basic.sc.smartedu.cn/bsservice/";
        // var u="http://192.168.1.12:8083/"
        _paq.push(["setTrackerUrl", u + "matomo.php"]);
        // _paq.push(['setSiteId', '5']);
        _paq.push(["setSiteId", "4"]);
        var d = document,
            g = d.createElement("script"),
            s = d.getElementsByTagName("script")[0];
        g.async = true;
        g.src =
            "https://cdnbasic.scbdc.edu.cn/%E5%9B%9B%E5%B7%9D%E7%9C%81%E4%B8%AD%E5%B0%8F%E5%AD%A6%E8%AF%BE%E5%90%8E%E6%9C%8D%E5%8A%A1%E5%B9%B3%E5%8F%B0/KHFW/js/matomo.js";
        s.parentNode.insertBefore(g, s);
    })();
</script>
